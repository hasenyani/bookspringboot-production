<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Buku</title>
</head>
<body>
<h1>Daftar Buku</h1>

<p th:if="${pesan}" th:text="${pesan}" style="color: green;"></p>
<p th:if="${pesanError}" th:text="${pesanError}" style="color: red;"></p>
<p>Total stok tersedia: <strong th:text="${jumlahStok}">0</strong> eksemplar</p>

<form th:action="@{/buku}" method="get">
    <input name="kata" th:value="${kata}" placeholder="Cari judul">
    <button type="submit">Cari</button>
</form>

<table border="1">
    <tr><th>ID</th><th>Judul</th><th>Stok</th><th>Aksi</th></tr>
    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}">B001</td>
        <td th:text="${b.judul}">Judul buku</td>
        <td th:text="${b.stok == 0 ? 'Habis' : b.stok}">0</td>
        <td>
            <details>
                <summary>Ubah</summary>
                <form th:action="@{/buku/{id}/ubah(id=${b.idBuku})}" method="post">
                    <input name="judul" th:value="${b.judul}" required>
                    <input name="stok" type="number" min="0" th:value="${b.stok}" required>
                    <button type="submit">Simpan</button>
                </form>
            </details>
            <form th:action="@{/buku/{id}/hapus(id=${b.idBuku})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Hapus buku ini?')">Hapus</button>
            </form>
        </td>
    </tr>
</table>

<h2>Tambah Buku</h2>
<form th:action="@{/buku}" method="post">
    <input name="idBuku" placeholder="ID" required>
    <input name="judul" placeholder="Judul" required>
    <input name="stok" type="number" min="0" value="1">
    <button type="submit">Simpan</button>
</form>
</body>
</html>
<a th:href="@{/anggota}">Lihat Anggota</a>
